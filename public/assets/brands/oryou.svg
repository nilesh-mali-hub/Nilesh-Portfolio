<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" fill="none">
  <!-- Lightbulb Circle Emblem -->
  <g id="emblem">
    <!-- Lime green background circle -->
    <circle cx="68" cy="65" r="48" fill="#C8FA00"/>
    
    <!-- Radiating Rays -->
    <path d="M68 28V33" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M42 35L45.5 38.5" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M94 35L90.5 38.5" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M31 60H36" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M100 60H105" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Bulb Outline -->
    <!-- Head -->
    <path d="M47 58C47 46.4 56.4 37 68 37C79.6 37 89 46.4 89 58C89 64.5 86 70 82 74C80.5 75.5 79.5 77.5 79.5 80V82H56.5V80C56.5 77.5 55.5 75.5 54 74C50 70 47 64.5 47 58Z" 
          fill="#C8FA00" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Screw base ridges -->
    <path d="M57 87H79" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M59 93H77" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M62 98H74" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Magnifying Glass inside bulb -->
    <circle cx="65" cy="54" r="11" stroke="#000" stroke-width="4.5" fill="#C8FA00"/>
    <path d="M73 62L82 72" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- ORYOU Typography -->
  <g id="text-oryou" fill="#000000">
    <!-- Letter O (First) -->
    <path d="M140 28C156 28 168 44 168 65C168 86 156 102 140 102C124 102 112 86 112 65C112 44 124 28 140 28Z" fill="#000"/>
    <!-- Inner counter of O (white oval cutout) -->
    <ellipse cx="140" cy="65" rx="10" ry="20" fill="#FFF"/>
    <!-- Lime eye / pupil inside O -->
    <ellipse cx="140" cy="65" rx="7.5" ry="9" fill="#C8FA00"/>
    <circle cx="142" cy="62" r="2" fill="#FFF"/>

    <!-- Letter R -->
    <path d="M178 30C178 30 197 29 207 31C217 33 223 41 223 50C223 58 217 65 207 67C214 70 220 78 223 88L226 97C227 100 225 102 222 102H206C203 102 201 100 200 97L197 87C195 80 192 76 186 76H185V102H168V30H178ZM185 45V62H201C205 62 208 59 208 53.5C208 48 205 45 201 45H185Z" fill="#000"/>

    <!-- Letter Y -->
    <path d="M231 30H249L259 55L269 30H287L269 68V102H251V68L231 30Z" fill="#000"/>

    <!-- Letter O (Second) -->
    <path d="M312 28C328 28 340 44 340 65C340 86 328 102 312 102C296 102 284 86 284 65C284 44 296 28 312 28Z" fill="#000"/>
    <!-- Inner counter of O (white oval cutout) -->
    <ellipse cx="312" cy="65" rx="10" ry="20" fill="#FFF"/>
    <!-- Lime eye / pupil inside O -->
    <ellipse cx="312" cy="65" rx="7.5" ry="9" fill="#C8FA00"/>
    <circle cx="314" cy="62" r="2" fill="#FFF"/>

    <!-- Letter U -->
    <path d="M352 30H370V72C370 82 376 87 385 87C394 87 400 82 400 72V30H418V72C418 92 404 102 385 102C366 102 352 92 352 72V30Z" fill="#000"/>
  </g>
</svg>
